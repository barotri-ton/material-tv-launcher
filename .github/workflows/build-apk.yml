name: Build APK

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'res/**', 'assets/**', 'third_party/**', 'AndroidManifest.xml', 'build.sh', '.github/workflows/build-apk.yml']
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'res/**', 'assets/**', 'third_party/**', 'AndroidManifest.xml', 'build.sh', '.github/workflows/build-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null
      - name: Build (min SDK 28 = Android 9)
        run: ./build.sh
      - name: Publish release (not on pull requests)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android9-latest
          gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" build/material-tv-launcher.apk install.sh uninstall.sh -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Android 9 build" \
            --notes "Material TV Launcher for Android 9+ (API 28). Built from $GITHUB_SHA."
